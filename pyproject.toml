[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-atlas-ingest"
version = "0.1.0"
description = "Multi-city building corpus ingestion for Our Civic Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Travis Gilbert" }]

dependencies = [
    "modal>=0.64",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "grpcio>=1.65",
    "grpcio-tools>=1.65",
    "protobuf>=5.27",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pillow>=10.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
# Modal apps are deployed via `modal deploy modal/ingest_overpass.py`
# This script entrypoint is just a discovery helper.
civic-atlas-ingest = "modal.__main__:cli"

[tool.setuptools.packages.find]
include = ["modal*", "primitives*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["S101"]  # assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
