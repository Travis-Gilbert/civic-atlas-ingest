[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-atlas-ingest"
version = "0.1.0"
description = "Multi-city building corpus ingestion for Our Civic Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Travis Gilbert" }]

dependencies = [
    "ray[serve,train]>=2.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "grpcio>=1.65",
    "grpcio-tools>=1.65",
    "protobuf>=5.27",
    "geopandas>=0.14",
    "osmnx>=2.0",
    "rasterio>=1.3",
    "pillow>=10.0",
    "boto3>=1.35",
    "jsonschema>=4.21",
    "tenacity>=8.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
corpus = [
    "pyarrow>=16.0",
]
ml = [
    "torch>=2.4",
    "torch-geometric>=2.5",
    "torch-sparse>=0.6.18",
    "torch-scatter>=2.1.2",
    "numpy>=1.26",
]

[project.scripts]
# Ray jobs are submitted with `ray job submit --working-dir . -- python -m ...`
# This script entrypoint is just a discovery helper.
civic-atlas-ingest = "civic_atlas_ingest.__main__:cli"

[tool.setuptools.packages.find]
include = ["civic_atlas_ingest*", "primitives*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["S101"]  # assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
